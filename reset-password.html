<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Login Code - Vanguard Prime</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a href="index.html" class="auth-logo">VANGUARD PRIME</a>
      <h1>Choose a new login code</h1>
      <p>Use a private six-digit code. Do not reuse a PIN that protects another account.</p>
      <form data-reset-form>
        <label>New login code<input type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="loginCode" required autocomplete="new-password" aria-describedby="login-code-help"></label>
        <small id="login-code-help">Exactly six numbers.</small>
        <label>Confirm login code<input type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="confirmation" required autocomplete="new-password"></label>
        <div data-message aria-live="polite"></div>
        <button type="submit">Reset Login Code</button>
      </form>
      <a href="login.html">Back to sign in</a>
    </section>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
