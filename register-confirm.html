<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm Your Email — StockPrime</title>
  <link rel="icon" type="image/svg+xml" href="storage/settings/hhb7Yj6zdj7QzEXWiKRVvkjJznru8eGnB5wKm2Ue.svg">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="verification.css?v=2026080601">
  <link rel="stylesheet" href="verification-notice.css?v=2026080601">
</head>
<body data-purpose="registration">
  <nav class="verify-nav"><a href="index.html"><img src="storage/settings/hhb7Yj6zdj7QzEXWiKRVvkjJznru8eGnB5wKm2Ue.svg" alt="StockPrime"></a><a href="login.html">Already confirmed? Sign in</a></nav>
  <main class="verify-shell">
    <section class="verify-card">
      <div class="mail-icon">✉</div>
      <h1>Confirm your email</h1>
      <p class="verify-copy">We sent a 6-digit confirmation code to</p>
      <div class="verify-email" data-email></div>
      <div class="delivery-tip"><strong>Cannot find the email?</strong><span>Check your Spam, Junk, or Promotions folder. The message is sent by StockPrime through Zoho Mail.</span></div>
      <div class="dev-code" data-development-code hidden></div>
      <form class="verify-form" data-verification-form>
        <input class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Six-digit confirmation code" required>
        <button class="verify-submit" type="submit">Confirm Email</button>
        <div class="verify-message" data-message aria-live="polite"></div>
      </form>
      <div class="verify-footer">Still didn't receive it? <button class="resend" data-resend type="button">Resend code</button><a class="change-link" href="register.html">Use a different email address</a></div>
    </section>
  </main>
  <script src="email-verification.js?v=2026080602"></script>
</body>
</html>
